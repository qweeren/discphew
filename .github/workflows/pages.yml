# Publishes the web Cover Printer (web/) to GitHub Pages: https://qweeren.github.io/discphew/
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Cover Printer site

on:
  push:
    branches: [ "main" ]
    paths: [ "web/**", "tests/web.test.mjs", ".github/workflows/pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test tests/web.test.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
